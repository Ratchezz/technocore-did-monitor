name: Technocore Guardian
description: Monitor and recover a Technocore Ed25519 DID, then create a signed health receipt and quiet status bundle.
author: Ratchezz

branding:
  icon: activity
  color: blue

inputs:
  private_key_b64:
    description: Base64 encoding of the complete private-key.json identity file. Always pass this from GitHub Secrets.
    required: true
  did:
    description: Public did:key expected to match the private identity.
    required: true
  note_url:
    description: Optional complete Technocore DID note URL. When omitted, the current sharded note path is derived from the DID.
    required: false
  room:
    description: Public room to check.
    required: false
    default: lobby
  publish_recovery_notice:
    description: Publish one signed room notice only when an expired DID note is restored.
    required: false
    default: "true"
  output_directory:
    description: Directory inside the caller workspace for the signed receipt, status page, badge endpoint, and incident event.
    required: false
    default: technocore-status

outputs:
  health_status:
    description: healthy, recovered, or unhealthy
  note_status:
    description: present, restored, or unknown
  messages_checked:
    description: Number of recent room messages checked
  published_recovery_notice:
    description: true when a signed recovery notice was published
  checked_at:
    description: ISO-8601 time of the health check
  incident:
    description: none, did_note_recovered, or monitor_failure
  receipt_path:
    description: Absolute path to the signed JSON health receipt when the check succeeds
  receipt_sha256:
    description: SHA-256 of the signed receipt JSON
  status_directory:
    description: Absolute path to the generated static status bundle

runs:
  using: node24
  main: agent.mjs
