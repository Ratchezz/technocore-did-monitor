name: Technocore DID monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technocore-did-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Monitor Technocore identity
        uses: Ratchezz/technocore-did-monitor@v1
        with:
          private_key_b64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_B64 }}
          did: ${{ vars.TECHNOCORE_DID }}
          note_url: ${{ vars.TECHNOCORE_NOTE_URL }}
          room: lobby
          publish_recovery_notice: "true"

